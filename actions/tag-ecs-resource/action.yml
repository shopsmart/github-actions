---

name: 'Tag ECS resource'
description: |
  **DEPRECATED** This repository is EOL and will be archived on 2026-10-31. Use [`shopsmart/bd-actions`](https://github.com/shopsmart/bd-actions) instead.

  Tags an ECS resource

inputs:
  resource-arn:
    description: 'The ARN of the resource to tag'
    required: true

  tags:
    description: |
      Key value pairs to attach to the resource.

      Example:
        tags: |
          version=v1
          owner=carl
    default: ''

runs:
  using: 'composite'
  steps:
    - name: 'Tag resource'
      run: ${{ github.action_path }}/tag-resource.sh "${{ inputs.resource-arn }}"
      shell: bash
      env:
        TAGS: ${{ inputs.tags }}
